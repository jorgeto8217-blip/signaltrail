name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Install, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate event fixtures
        run: pnpm fixtures:validate

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  compose:
    name: Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Start PostgreSQL and Redis
        run: docker compose up -d --wait

      - name: Check services respond
        run: |
          docker compose exec -T postgres pg_isready -U signaltrail -d signaltrail
          docker compose exec -T redis redis-cli ping | grep -qx PONG

      - name: Stop stack
        if: always()
        run: docker compose down -v
